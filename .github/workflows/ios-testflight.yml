name: iOS build / TestFlight

# Builds the iPhone app on a GitHub macOS runner (no Mac needed).
#  - Always: compiles the app for the simulator, to prove the project builds.
#  - When the four Apple secrets below exist: archives, signs (Xcode automatic
#    signing through the App Store Connect API key) and uploads to TestFlight.
#
# Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com -> Membership)
#   APPSTORE_KEY_ID      App Store Connect API key ID
#   APPSTORE_ISSUER_ID   Issuer ID (same page as the key)
#   APPSTORE_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
#
# Push notifications: after Push Notifications is enabled on the App ID
# (developer.apple.com -> Identifiers -> noexcusesbadminton.app), add a repository
# VARIABLE (not a secret) named IOS_PUSH with the value true. Builds then carry the
# aps-environment entitlement from mobile/ios/App/App/App.entitlements.

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-testflight.yml"
  # Pull requests that touch the iPhone app get the simulator build check too
  # (the TestFlight upload below only ever runs on main).
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      IOS_PUSH: ${{ vars.IOS_PUSH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pick the newest Xcode 26
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install JS dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Compile for the simulator (sanity check)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 25

      - name: Do we have Apple credentials?
        id: creds
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPSTORE_KEY_ID" ] && [ -n "$APPSTORE_ISSUER_ID" ] && [ -n "$APPSTORE_KEY_P8" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple secrets not set yet - build check passed, skipping TestFlight upload."
          fi

      - name: Archive, sign and upload to TestFlight
        if: steps.creds.outputs.have == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Archive UNSIGNED, then let the export step sign it for the App Store with a
          # cloud-managed distribution certificate. (Signing at archive time needs a
          # development profile, which needs a registered iPhone - we have none.)
          KEY="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" \
                -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID")

          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 25

          # The archive is unsigned, so it carries no entitlements. For push, stamp them on
          # (ad-hoc); the export step re-signs with the real certificate and keeps them.
          if [ "${IOS_PUSH:-}" = "true" ]; then
            APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
            codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
            echo "Entitlements on the app:"; codesign -d --entitlements - "$APP" 2>&1 | grep -E "aps-environment|<string>" || true
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 25
          rm -f "$KEY"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect (TestFlight)."

      - name: Show why the upload failed
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log"; do
            [ -f "$f" ] || continue
            grep -E "error:|ARCHIVE FAILED|EXPORT FAILED|Provisioning|No profiles|No Accounts|not found|Communication with Apple" "$f" \
              | sort -u | head -n 12 | while IFS= read -r line; do echo "::error title=$(basename "$f")::${line}"; done
          done
